<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    :root { color-scheme: light dark; }
    body {
      width: 330px;
      margin: 0;
      padding: 14px;
      font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    h1 { margin: 0 0 10px; font-size: 13px; font-weight: 600; }
    #title {
      margin-bottom: 10px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin: 0 0 12px; }
    dt { opacity: 0.6; }
    dd { margin: 0; }
    .warn { color: #c26a00; }
    button {
      width: 100%;
      padding: 8px;
      margin-bottom: 6px;
      font: inherit;
      font-weight: 600;
      border: 1px solid rgba(128, 128, 128, 0.45);
      border-radius: 6px;
      background: transparent;
      color: inherit;
      cursor: pointer;
    }
    button:hover:not(:disabled) { background: rgba(128, 128, 128, 0.14); }
    button:disabled { opacity: 0.45; cursor: default; }
    button.secondary { font-weight: 400; }
    progress { width: 100%; height: 6px; margin: 2px 0 8px; }
    progress:not([value]) { display: none; }
    #msg {
      margin-top: 8px;
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
      white-space: pre-wrap;
      display: none;
    }
    #msg.show { display: block; }
    #msg.err { background: rgba(220, 60, 60, 0.14); }
    #msg.ok { background: rgba(60, 170, 90, 0.16); }
    details { margin-top: 10px; font-size: 12px; }
    details summary { cursor: pointer; opacity: 0.7; }
    details button { margin-top: 6px; }
    label { display: block; margin-top: 6px; opacity: 0.7; }
    .note { margin-top: 4px; font-size: 11px; opacity: 0.6; }
    select, input {
      width: 100%;
      box-sizing: border-box;
      padding: 5px 6px;
      font: inherit;
      border: 1px solid rgba(128, 128, 128, 0.45);
      border-radius: 4px;
      background: transparent;
      color: inherit;
    }
  </style>
</head>
<body>
  <h1>JP Subs</h1>

  <div id="title"></div>
  <dl id="facts"></dl>

  <progress id="bar"></progress>
  <button id="go" disabled>Translate &amp; show subtitles</button>
  <button id="again" class="secondary" hidden>Re-translate</button>
  <button id="save" class="secondary" disabled>Save transcript only</button>
  <div id="msg"></div>

  <details>
    <summary>Settings</summary>
    <label for="model">Ollama model</label>
    <select id="model"><option value="">(loading…)</option></select>
    <div id="modelNote" class="note"></div>
    <label for="host">Ollama host</label>
    <input id="host" placeholder="http://localhost:11434" />

    <label>Cached translations</label>
    <div id="cacheNote" class="note">…</div>
    <button id="clearCache" class="secondary">Clear cache</button>
  </details>

  <script src="popup.js"></script>
</body>
</html>
