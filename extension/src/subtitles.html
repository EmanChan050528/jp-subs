<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>JP Subs — translate a subtitle file</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      max-width: 720px;
      margin: 0 auto;
      padding: 32px 24px 64px;
      font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    h1 { margin: 0 0 4px; font-size: 18px; }
    .lede { margin: 0 0 24px; opacity: 0.7; }
    section { margin-bottom: 20px; }
    h2 { margin: 0 0 8px; font-size: 13px; font-weight: 600; opacity: 0.65; }

    /* The drop zone is the whole first step, so it is deliberately large --
       a file picker button alone read as an afterthought. */
    #drop {
      padding: 28px 20px;
      border: 2px dashed rgba(128, 128, 128, 0.45);
      border-radius: 10px;
      text-align: center;
      cursor: pointer;
    }
    #drop:hover, #drop.over { border-color: rgba(90, 140, 220, 0.9); background: rgba(90, 140, 220, 0.08); }
    #drop p { margin: 0; }
    #drop .hint { margin-top: 6px; font-size: 12px; opacity: 0.6; }
    #file { display: none; }

    dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0; }
    dt { opacity: 0.6; }
    dd { margin: 0; }

    button {
      padding: 9px 14px;
      font: inherit;
      font-weight: 600;
      border: 1px solid rgba(128, 128, 128, 0.45);
      border-radius: 6px;
      background: transparent;
      color: inherit;
      cursor: pointer;
    }
    button:hover:not(:disabled) { background: rgba(128, 128, 128, 0.14); }
    button:active:not(:disabled) { background: rgba(128, 128, 128, 0.28); transform: translateY(1px); }
    button:disabled { opacity: 0.45; cursor: default; }
    button.secondary { font-weight: 400; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

    progress { width: 100%; height: 8px; margin: 10px 0 6px; }
    progress:not([value]) { display: none; }
    #status { min-height: 1.5em; font-variant-numeric: tabular-nums; }

    label { display: block; margin-top: 10px; font-size: 12px; opacity: 0.7; }
    select, input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      font: inherit;
      border: 1px solid rgba(128, 128, 128, 0.45);
      border-radius: 4px;
      background: transparent;
      color: inherit;
    }
    .note { margin-top: 6px; font-size: 12px; opacity: 0.65; }
    .warn { color: #c26a00; }
    #msg {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 6px;
      white-space: pre-wrap;
      display: none;
    }
    #msg.show { display: block; }
    #msg.err { background: rgba(220, 60, 60, 0.14); }
    #msg.ok { background: rgba(60, 170, 90, 0.16); }
    details { margin-top: 16px; font-size: 13px; }
    details summary { cursor: pointer; opacity: 0.7; }
    #log {
      max-height: 260px;
      overflow: auto;
      margin: 8px 0 0;
      padding: 10px;
      font: 12px/1.5 ui-monospace, Consolas, monospace;
      background: rgba(128, 128, 128, 0.12);
      border-radius: 6px;
      white-space: pre-wrap;
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <h1>Translate a subtitle file</h1>
  <p class="lede">
    Japanese <code>.srt</code> or <code>.vtt</code> in, English <code>.srt</code>
    out — for video that is not on YouTube.
  </p>

  <section>
    <div id="drop">
      <p><strong>Drop a .srt or .vtt file here</strong></p>
      <p class="hint">or click to choose one</p>
      <input id="file" type="file" accept=".srt,.vtt,.txt,text/plain" />
    </div>
    <div id="fileMsg" class="note"></div>
  </section>

  <section id="facts" hidden>
    <h2>File</h2>
    <dl id="factList"></dl>
    <label for="context">Title or context — optional, but it improves the glossary</label>
    <input id="context" type="text" placeholder="e.g. Hololive stream, Stardew Valley playthrough" />
  </section>

  <section id="controls" hidden>
    <div class="row">
      <button id="go">Translate</button>
      <button id="stop" class="secondary" hidden>Stop</button>
      <button id="download" class="secondary" hidden>Download English .srt</button>
    </div>
    <progress id="bar"></progress>
    <div id="status"></div>
    <div id="msg"></div>
  </section>

  <details id="settings">
    <summary>Settings</summary>
    <label for="model">Ollama model</label>
    <select id="model"><option value="">(loading…)</option></select>
    <div id="modelNote" class="note"></div>
    <label for="host">Ollama host</label>
    <input id="host" type="text" placeholder="http://localhost:11434" />
    <div class="note">These are the same settings the popup uses.</div>
  </details>

  <details id="logBox" hidden>
    <summary>Details</summary>
    <pre id="log"></pre>
  </details>

  <script type="module" src="subtitles.js"></script>
</body>
</html>
